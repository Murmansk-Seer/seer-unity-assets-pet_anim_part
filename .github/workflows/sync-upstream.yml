name: Sync Upstream
'on':
  schedule:
  - cron: 34 * * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare without pushing
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false
jobs:
  sync:
    uses: Murmansk-Seer/.github/.github/workflows/sync-identical-reusable.yml@0750ab5a93b324a34304a91745ba91da07dddde1
    with:
      implementation_ref: 0750ab5a93b324a34304a91745ba91da07dddde1
      dry_run: ${{ inputs.dry_run == true }}
