name: Sync Upstream
'on':
  schedule:
  - cron: 34 * * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare without pushing
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false
jobs:
  sync:
    uses: Murmansk-Seer/.github/.github/workflows/sync-identical-reusable.yml@c8331ef9eb05f6bcae0baa5f4be4202bc2e49e4a
    with:
      implementation_ref: c8331ef9eb05f6bcae0baa5f4be4202bc2e49e4a
      dry_run: ${{ inputs.dry_run == true }}
